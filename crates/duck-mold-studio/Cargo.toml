[package]
name = "duck-mold-studio"
description = "Duck Mold Studio's screens, as a library: the window where a model is built with the mouse. The program DuckMoldStudio (duck-mold-studio-app) and Duck Forge's Studio both show it. Every edit it makes is a `duck-mold edit` command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
duck-mold-core = { workspace = true }
duck-mold-view = { workspace = true }
eframe = { workspace = true }
rfd = { workspace = true }
# Where Documents is: on Windows, the folder Windows says (moved to
# OneDrive, say), not always USERPROFILE\Documents.
dirs = "6.0.0"

[dev-dependencies]
egui_kittest = { workspace = true }
# For the test that draws the icon from the duck recipe.
png = { workspace = true }

[lints]
workspace = true
