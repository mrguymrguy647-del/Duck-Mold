# Starter animation `jump`, for a two-legged character: crouches with
# the arms back, rises 40 cm with the arms up, lands in a crouch and
# straightens.
# It moves: body, left_leg, right_leg, left_arm, right_arm.
# To use it: duck-mold edit <recipe> add-animation jump --starter jump
version = 0
name = "jump"

[poses.jump_crouch]
body = { move = [0, -0.03, 0] }
left_leg = [-25, 0, 0]
right_leg = [-25, 0, 0]
left_arm = [-40, 0, 0]
right_arm = [-40, 0, 0]

[poses.jump_up]
body = { move = [0, 0.4, 0] }
left_leg = [10, 0, 0]
right_leg = [10, 0, 0]
left_arm = [160, 0, 0]
right_arm = [160, 0, 0]

[animations.jump]
keys = [
  { at = 0, pose = "rest" },
  { at = 0.3, pose = "jump_crouch", event = "takeoff" },
  { at = 0.65, pose = "jump_up" },
  { at = 1, pose = "jump_crouch", event = "land" },
  { at = 1.3, pose = "rest" },
]
