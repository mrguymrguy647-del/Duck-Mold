[package]
name = "duck-mold-view"
description = "Pictures of Duck Mold models, drawn by Duck Forge's CPU renderer: `duck-mold render`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
duck-mold-core = { workspace = true }
duckforge = { workspace = true }
png = { workspace = true }
serde = { workspace = true }

[features]
# The preview window: Duck Forge's window (winit and softbuffer; on Linux,
# X11 is loaded when the window opens, so building needs no extra
# packages). The command line turns it on by default; without it,
# everything else still builds and works, for machines with no screen.
preview = ["duckforge/window"]

[lints]
workspace = true
