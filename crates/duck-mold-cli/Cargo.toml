[package]
name = "duck-mold-cli"
description = "The `duck-mold` command: build and inspect 3D models from text recipes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# The words of `duck-mold edit` are a library too, for other programs
# that take the same words (Duck Forge's Studio).
[lib]
name = "duck_mold_cli"
path = "src/lib.rs"

# The program is called `duck-mold`, not `duck-mold-cli`.
[[bin]]
name = "duck-mold"
path = "src/main.rs"

[dependencies]
duck-mold-core = { workspace = true }
duck-mold-view = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
