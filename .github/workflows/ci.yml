# Builds and tests Duck Mold on Windows, Linux and macOS for every push and pull
# request, checks the formatting, and runs clippy (Rust's checker for
# common mistakes). A copy of Duck Quill's, plus the formatting check. A
# red cross on GitHub means one of these steps failed: click it to see
# which.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch replaces a run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same Rust as the one the project is developed with, so a new Rust
  # release can't suddenly turn the build red.
  RUST_VERSION: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      # Keeps the compiled libraries between runs: minutes faster.
      - uses: Swatinem/rust-cache@v2
      # The Studio's screen tests draw whole screens with no window and
      # compare them with stored pictures, on Linux only. Drawing needs a
      # Vulkan driver, and this is the one that runs on the processor.
      - name: Install a software graphics driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      # The Studio's screens are compared with stored pictures, and the
      # pictures are this machine's: its software driver drew them, and
      # another driver draws letters a little differently. So a screen
      # that was changed on purpose, or a new one, can only be drawn for
      # storing here. When the test above fails on Linux, the screens
      # are drawn as they are now and kept with the run (the file
      # "screens" at the bottom of the run's page): look at them, and
      # put the ones that are right in crates/duck-mold-studio/tests/screens.
      - name: Draw the screens as they are now
        if: failure() && runner.os == 'Linux'
        run: |
          UPDATE_SNAPSHOTS=1 cargo test -p duck-mold-studio --test pictures
          mkdir changed-screens
          git status --porcelain -- crates/duck-mold-studio/tests/screens \
            | awk '{print $2}' | xargs -r -I{} cp {} changed-screens/
          ls changed-screens
      - name: Keep them with the run
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: changed-screens
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets -- -D warnings
      # How fast the Studio is with a big model (50 parts, about 20,000
      # triangles), on GitHub's Windows machine, which stands for an
      # ordinary laptop. The times are printed for reading, not checked:
      # machines differ too much for a pass or a fail.
      - name: Speed (printed, not checked)
        if: runner.os == 'Windows'
        run: cargo test --release -p duck-mold-view --test speed -- --ignored --nocapture

  # The start files for Linux and Mac (start-duck-mold-studio.sh, "Start
  # Duck Mold Studio.command", create-desktop-shortcut.sh): checked by
  # shellcheck, which finds the usual mistakes of shell scripts, and the
  # build part run, as someone who double-clicks them would.
  start-files:
    name: Start files (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck start-duck-mold-studio.sh "Start Duck Mold Studio.command" create-desktop-shortcut.sh \
            install.sh release/test-bare.sh release/make-source.sh
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Build, as the start file does
        run: ./start-duck-mold-studio.sh --build-only
      - name: The Studio is there
        run: test -x target/release/DuckMoldStudio
      # The README's way for Rust users: cargo install, from the source.
      - name: cargo install
        run: |
          cargo install --locked --path crates/duck-mold-cli --root "$RUNNER_TEMP/cargo-install"
          "$RUNNER_TEMP/cargo-install/bin/duck-mold" --version
      - name: The desktop shortcut
        if: runner.os == 'Linux'
        run: |
          HOME="$RUNNER_TEMP/home" ./create-desktop-shortcut.sh
          grep -q 'target/release/DuckMoldStudio' "$RUNNER_TEMP/home/.local/share/applications/duck-mold-studio.desktop"
