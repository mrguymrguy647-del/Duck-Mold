# Makes every download of a release, tests each as the person who gets it
# would use it, and publishes them together with the version's section of
# RELEASE_NOTES.md as the text. Nothing is published unless every job
# passed.
#
# - Windows: the installer, DuckMoldSetup-<version>.exe (installed,
#   installed over and uninstalled here), and DuckMold-<version>-windows.zip.
# - Linux: duck-mold-<version>-linux-x86_64 and -linux-arm64, the program
#   on its own, built so that it needs nothing else on the machine
#   ("static"). Each is run on every example in bare Debian and Alpine
#   containers with no network at all.
# - Mac: duck-mold-<version>-macos, one file for both Apple processors.
# - DuckMoldStudio-<version>-linux-x86_64.tar.gz: the Studio for Linux,
#   built on Ubuntu 22.04 so it runs on that and anything newer.
# - duck-mold-<version>-source.tar.gz: the program's source with every
#   library inside, built here with no network to prove it.
# - SHA256SUMS: a fingerprint of every file, which install.sh checks.
#   After publishing, install.sh installs the new release and runs it.
#
# Three ways to make a release, none needing a terminal:
# - Actions tab -> Release -> "Run workflow" (the "Make a release" button):
#   reads the version from Cargo.toml, makes the tag vX.Y.Z on the chosen
#   branch's newest commit, and publishes the release.
# - Releases -> "Draft a new release" on the GitHub website with a new tag
#   like v0.2.0: this workflow runs on the tag and adds the files to it.
# - Pushing a tag like v0.2.0.
# If the release is already there, its files are replaced (--clobber)
# instead of failing. Changing this file (or the release/ folder, or
# install.sh) on a branch only builds and tests everything and keeps the
# files on the run's page as "artifacts", so they can be checked before
# any release is made.
name: Release

on:
  # The "Make a release" button in the Actions tab. (GitHub only shows it
  # once this file is on the main branch.)
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    # Branch pushes only run when the release itself changed (tags always run).
    paths: [".github/workflows/release.yml", "release/**", "RELEASE_NOTES.md", "install.sh"]
  pull_request:
    paths: [".github/workflows/release.yml", "release/**", "RELEASE_NOTES.md", "install.sh"]

env:
  RUST_VERSION: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        shell: bash
        run: |
          # The one place it's written: the workspace Cargo.toml.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the version $version in Cargo.toml."
            exit 1
          fi
          # The tag to publish under: the pushed tag, or v<version> for the button.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --workspace

      - name: Put the zip together
        shell: bash
        run: |
          name="DuckMold-${{ steps.version.outputs.version }}-windows"
          folder="dist/Duck Mold"
          mkdir -p "$folder/docs"
          cp target/release/DuckMoldStudio.exe target/release/duck-mold.exe "$folder/"
          cp -r examples "$folder/"
          cp docs/AI_GUIDE.md docs/recipe-format.md "$folder/docs/"
          cp "release/READ ME FIRST.txt" "release/Create desktop shortcut.bat" "$folder/"
          cd dist
          7z a -tzip "../$name.zip" "Duck Mold" > /dev/null
          cd ..
          ls -l "$name.zip"
          echo "ZIP=$name.zip" >> "$GITHUB_ENV"

      - name: Check what's in the zip
        shell: bash
        run: |
          7z l -slt "$ZIP" | sed -n 's/^Path = //p' > contents.txt
          echo "$(wc -l < contents.txt) entries; the top of the folder:"
          grep -E '^Duck Mold(/|\\)[^/\\]+$' contents.txt
          for wanted in DuckMoldStudio.exe duck-mold.exe "READ ME FIRST.txt" "Create desktop shortcut.bat" \
                        examples/robot.toml examples/duck.toml examples/parts/lamp.gltf \
                        examples/textures/robot_face.png examples/pip.toml examples/textures/pip_face.png \
                        examples/parts/sign.gltf examples/parts/sign_post.png \
                        docs/AI_GUIDE.md docs/recipe-format.md; do
            grep -qxF "Duck Mold/$wanted" <(tr '\\' / < contents.txt) || { echo "missing: $wanted"; exit 1; }
          done
          # The programs start, know their version, and can read an example.
          ver=$("dist/Duck Mold/duck-mold.exe" --version)
          echo "$ver"
          [[ "$ver" == "duck-mold ${{ steps.version.outputs.version }}" ]]
          "dist/Duck Mold/duck-mold.exe" inspect "dist/Duck Mold/examples/robot.toml"
          # A model with images, and one whose pictures came inside a
          # glTF file (a JPEG among them): each exports, pictures and all.
          "dist/Duck Mold/duck-mold.exe" export "dist/Duck Mold/examples/pip.toml" -o pip.glb
          "dist/Duck Mold/duck-mold.exe" export "dist/Duck Mold/examples/signpost.toml" -o signpost.glb
          "dist/Duck Mold/duck-mold.exe" inspect pip.glb
          # The Studio is a window program: asked for its version, it
          # must end at once without opening one.
          "dist/Duck Mold/DuckMoldStudio.exe" --version
          # And duck-mold finds the Studio next to it: with a file that
          # isn't there it says so, rather than that the Studio is missing.
          if "dist/Duck Mold/duck-mold.exe" studio nowhere.toml 2> said.txt; then exit 1; fi
          cat said.txt
          grep -q "there is no such file" said.txt

      - name: Keep the zip on this run's page
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DVersion=$env:VERSION" "/DSource=$pwd\dist\Duck Mold" "/O$pwd\dist" release\DuckMold.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = "dist/DuckMoldSetup-$env:VERSION.exe"
          Get-Item $setup | Format-List Name, Length
          "SETUP=$setup" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Keep the installer on this run's page
        uses: actions/upload-artifact@v5
        with:
          name: DuckMoldSetup-${{ env.VERSION }}
          path: ${{ env.SETUP }}

      - name: Install it, as a person would (no administrator rights)
        shell: pwsh
        run: |
          $setup = Start-Process $env:SETUP -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$pwd\install.log"
          if ($setup.ExitCode -ne 0) { Get-Content install.log; throw "the installer said $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Duck Mold"
          foreach ($file in 'DuckMoldStudio.exe', 'duck-mold.exe', 'READ ME FIRST.txt', 'examples\robot.toml',
                            'examples\parts\lamp.gltf', 'examples\textures\robot_face.png', 'examples\pip.toml',
                            'docs\AI_GUIDE.md', 'docs\recipe-format.md', 'unins000.exe') {
            if (-not (Test-Path "$app\$file")) { throw "not installed: $file" }
          }
          if (Test-Path "$app\Create desktop shortcut.bat") { throw "the zip's shortcut maker isn't needed here" }
          # The Start menu entry points at the Studio.
          $shell = New-Object -ComObject WScript.Shell
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Duck Mold Studio.lnk'
          if (-not (Test-Path $link)) { throw "no Start menu entry" }
          $target = $shell.CreateShortcut($link).TargetPath
          if ($target -ne "$app\DuckMoldStudio.exe") { throw "the Start menu entry points at $target" }
          # Windows Settings > Apps lists it, for this person only.
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F2C1D84-3B7E-4E8A-9C51-2D7A0B9E4F63}_is1'
          $entry = Get-ItemProperty $key
          if ($entry.DisplayVersion -ne $env:VERSION) { throw "listed as version $($entry.DisplayVersion)" }
          # The folder is on the person's own PATH, once.
          $path = (Get-ItemProperty 'HKCU:\Environment').Path
          $count = @($path -split ';' | Where-Object { $_ -eq $app }).Count
          if ($count -ne 1) { throw "the folder is on the PATH $count times: $path" }
          # No file association.
          if (Test-Path 'HKCU:\Software\Classes\.toml') { throw ".toml was given to Duck Mold" }
          # The installed programs work.
          $ver = & "$app\duck-mold.exe" --version | Out-String
          if ($ver.Trim() -ne "duck-mold $env:VERSION") { throw "the installed duck-mold says $ver" }
          & "$app\duck-mold.exe" inspect "$app\examples\robot.toml"
          if ($LASTEXITCODE -ne 0) { throw "inspect failed on the installed robot" }
          # The installed robot has its painted face: its images came along.
          & "$app\duck-mold.exe" export "$app\examples\robot.toml" -o "$pwd\installed-robot.glb"
          if ($LASTEXITCODE -ne 0) { throw "the installed robot didn't export" }
          $report = & "$app\duck-mold.exe" inspect "$pwd\installed-robot.glb" --json | ConvertFrom-Json
          if (-not $report.images) { throw "the installed robot's .glb has no images" }
          $studio = & "$app\DuckMoldStudio.exe" --version | Out-String
          if ($studio.Trim() -ne "DuckMoldStudio $env:VERSION") { throw "the installed Studio says $studio" }
          "Installed $env:VERSION in $app"

      - name: Installing over it keeps my models
        shell: pwsh
        run: |
          $models = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Duck Mold'
          New-Item -ItemType Directory -Force $models | Out-Null
          Copy-Item "$env:LOCALAPPDATA\Programs\Duck Mold\examples\crate.toml" "$models\mine.toml"
          $setup = Start-Process $env:SETUP -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($setup.ExitCode -ne 0) { throw "installing again said $($setup.ExitCode)" }
          if (-not (Test-Path "$models\mine.toml")) { throw "my model is gone" }
          $app = "$env:LOCALAPPDATA\Programs\Duck Mold"
          $path = (Get-ItemProperty 'HKCU:\Environment').Path
          $count = @($path -split ';' | Where-Object { $_ -eq $app }).Count
          if ($count -ne 1) { throw "after installing again, the folder is on the PATH $count times" }
          "Kept: $models\mine.toml"

      - name: Uninstall it, and my models stay
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Duck Mold"
          $models = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Duck Mold'
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller carries on from a copy of itself: wait for it.
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F2C1D84-3B7E-4E8A-9C51-2D7A0B9E4F63}_is1'
          for ($i = 0; $i -lt 120 -and ((Test-Path $key) -or (Test-Path $app)); $i++) { Start-Sleep 1 }
          if (Test-Path $key) { throw "still listed in Settings > Apps" }
          if (Test-Path $app) { Get-ChildItem -Recurse $app; throw "the folder is still there" }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Duck Mold Studio.lnk')) { throw "the Start menu entry is left" }
          $path = (Get-ItemProperty 'HKCU:\Environment').Path
          if (($path -split ';') -contains $app) { throw "the folder is still on the PATH: $path" }
          if (-not (Test-Path "$models\mine.toml")) { throw "uninstalling took my model" }
          "Uninstalled. Still there: $models\mine.toml"


  # duck-mold on its own, for Linux: static (musl), so it runs on any
  # Linux, Alpine included, with nothing installed. This is also the file
  # to give an AI that works in a sandbox (ChatGPT's): it needs nothing.
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION"
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p duck-mold-cli --target ${{ matrix.target }}
      - name: Name it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          name="duck-mold-$version-linux-${{ matrix.arch }}"
          mkdir dist
          cp target/${{ matrix.target }}/release/duck-mold "dist/$name"
          echo "FILE=dist/$name" >> "$GITHUB_ENV"
          ls -l dist
      - name: It needs nothing else
        run: |
          file "$FILE"
          file "$FILE" | grep -Eq 'statically linked|static-pie linked'
      - name: It works here
        run: release/test-bare.sh "$FILE" examples "$VERSION"
      # As someone with nothing at all would run it: in bare containers,
      # with no network. The same test, on every example.
      - name: It works on bare Debian, with no network
        run: |
          docker run --rm --network none -v "$PWD:/w:ro" debian:stable-slim \
            sh /w/release/test-bare.sh "/w/$FILE" /w/examples "$VERSION"
      - name: It works on bare Alpine, with no network
        run: |
          docker run --rm --network none -v "$PWD:/w:ro" alpine:latest \
            sh /w/release/test-bare.sh "/w/$FILE" /w/examples "$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.FILE }}

  # duck-mold on its own, for a Mac: one file with both the Apple-chip
  # and the Intel program in it ("universal").
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Build for both processors
        run: |
          cargo build --release -p duck-mold-cli --target aarch64-apple-darwin
          cargo build --release -p duck-mold-cli --target x86_64-apple-darwin
      - name: One file for both
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir dist
          lipo -create -output "dist/duck-mold-$version-macos" \
            target/aarch64-apple-darwin/release/duck-mold target/x86_64-apple-darwin/release/duck-mold
          echo "FILE=dist/duck-mold-$version-macos" >> "$GITHUB_ENV"
          lipo -archs "dist/duck-mold-$version-macos" | tee archs.txt
          grep -q x86_64 archs.txt && grep -q arm64 archs.txt
      - name: It works
        run: release/test-bare.sh "$FILE" examples "$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: ${{ env.FILE }}

  # The Studio for Linux, with duck-mold, the examples and the guides.
  # Built on the oldest Ubuntu GitHub has, so that it runs there and on
  # anything newer.
  linux-studio:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Put the folder together
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          folder="dist/Duck Mold"
          mkdir -p "$folder/docs"
          cp target/release/DuckMoldStudio target/release/duck-mold "$folder/"
          cp -r examples "$folder/"
          cp docs/AI_GUIDE.md docs/recipe-format.md "$folder/docs/"
          cp "release/linux/READ ME FIRST.txt" create-desktop-shortcut.sh "$folder/"
          cp crates/duck-mold-studio/assets/icon.png "$folder/"
          name="DuckMoldStudio-$version-linux-x86_64.tar.gz"
          tar -czf "$name" -C dist "Duck Mold"
          echo "TARBALL=$name" >> "$GITHUB_ENV"
          ls -l "$name"
      - name: Check what's in it
        run: |
          rm -rf check && mkdir check && tar -xzf "$TARBALL" -C check
          app="check/Duck Mold"
          for wanted in DuckMoldStudio duck-mold "READ ME FIRST.txt" create-desktop-shortcut.sh icon.png \
                        examples/robot.toml examples/parts/lamp.gltf examples/textures/robot_face.png \
                        docs/AI_GUIDE.md docs/recipe-format.md; do
            [ -e "$app/$wanted" ] || { echo "missing: $wanted"; exit 1; }
          done
          [ -x "$app/DuckMoldStudio" ] && [ -x "$app/duck-mold" ] && [ -x "$app/create-desktop-shortcut.sh" ]
          # The Studio is a window program: asked for its version, it
          # ends at once without opening one.
          [ "$("$app/DuckMoldStudio" --version)" = "DuckMoldStudio $VERSION" ]
          # duck-mold finds the Studio beside it.
          if "$app/duck-mold" studio nowhere.toml 2> said.txt; then exit 1; fi
          grep -q "there is no such file" said.txt
          release/test-bare.sh "$app/duck-mold" "$app/examples" "$VERSION"
          HOME="$RUNNER_TEMP/home" "$app/create-desktop-shortcut.sh"
          grep -q "Duck Mold/DuckMoldStudio" "$RUNNER_TEMP/home/.local/share/applications/duck-mold-studio.desktop"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-studio
          path: ${{ env.TARBALL }}

  # The program's source with every library inside, for building with no
  # internet. Built here in a container with no network to prove it.
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Make the archive
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          release/make-source.sh "$version" dist
          echo "ARCHIVE=dist/duck-mold-$version-source.tar.gz" >> "$GITHUB_ENV"
      - name: It builds with no network, and works
        run: |
          mkdir offline && tar -xzf "$ARCHIVE" -C offline
          docker run --rm --network none -v "$PWD/offline:/src" -v "$PWD:/repo:ro" \
            -w "/src/duck-mold-$VERSION" "rust:$RUST_VERSION-slim" sh -c "
              cargo build --offline --release -p duck-mold-cli &&
              sh /repo/release/test-bare.sh target/release/duck-mold /repo/examples $VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: source
          path: ${{ env.ARCHIVE }}

  # Publishes everything together, only when every job above passed.
  publish:
    needs: [windows, linux, macos, linux-studio, source]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    steps:
      - uses: actions/checkout@v5
      - name: Read the version
        id: version
        run: |
          # The one place it's written: the workspace Cargo.toml.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "Version: $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the version $version in Cargo.toml."
            exit 1
          fi
          # The tag to publish under: the pushed tag, or v<version> for the button.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=v$version" >> "$GITHUB_ENV"
          fi
      - name: Read this version's release notes
        run: |
          # The text between "## <version>" and the next "## " heading.
          awk -v want="## $VERSION" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' RELEASE_NOTES.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "RELEASE_NOTES.md has no section \"## $VERSION\": write one first."
            exit 1
          fi
          cat notes.md
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Fingerprints
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          for wanted in "DuckMoldSetup-$VERSION.exe" "DuckMold-$VERSION-windows.zip" \
                        "duck-mold-$VERSION-linux-x86_64" "duck-mold-$VERSION-linux-arm64" \
                        "duck-mold-$VERSION-macos" "DuckMoldStudio-$VERSION-linux-x86_64.tar.gz" \
                        "duck-mold-$VERSION-source.tar.gz"; do
            grep -q "  $wanted\$" SHA256SUMS || { echo "missing: $wanted"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Made on the website (or made before): add the files, replacing
            # older ones of the same name, and the notes, instead of failing.
            echo "The release $TAG is already there: adding the files to it."
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            # --target makes the tag on this run's commit if it doesn't exist.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Duck Mold $VERSION" \
              --notes-file notes.md
          fi
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
      # The one-line install, against the release just published.
      - name: install.sh installs it
        run: |
          DUCK_MOLD_VERSION="$VERSION" DUCK_MOLD_DIR="$RUNNER_TEMP/bin" sh install.sh
          [ "$("$RUNNER_TEMP/bin/duck-mold" --version)" = "duck-mold $VERSION" ]
          # And with no version given, the newest: this one.
          DUCK_MOLD_DIR="$RUNNER_TEMP/newest" sh install.sh
          "$RUNNER_TEMP/newest/duck-mold" --version
