# A barn: the `prism` shape.
#
#   duck-mold studio examples/barn.toml
#
# It shows: a prism for the roof (two slopes, left and right, meeting in
# a ridge that runs from front to back; its `top` socket is the middle
# of the ridge), faces coloured by name, a silo made of a cylinder and a
# capsule's round end, and a ramp (`wedge`) up to the door.

version = 0
name = "barn"
description = "A red barn with a silo."

[palette]
red   = "#B23A2E"
white = "#F1ECE0"
roof  = "#5B5F66"
door  = "#7A4A2A"
steel = "#B9C0C6"

[[parts]]
name = "walls"
shape = "box"
size = [3, 2, 4]
color = "red"

[parts.sockets]
door = { on = "front", shift = [0, -1, 0] }
loft = { on = "front", shift = [0, 0.75, 0] }
silo = { on = "right", shift = [0, -1, -0.5] }

# A little wider and longer than the walls, so it overhangs.
[[parts]]
name = "roof"
shape = "prism"
size = [3.4, 1.2, 4.3]
color = "roof"
colors = { front = "red", back = "red" }
attach = "bottom"
to = "walls.top"

[[parts]]
name = "door"
shape = "box"
size = [1.3, 1.5, 0.08]
color = "door"
attach = "bottom_back"
to = "walls.door"

[parts.sockets]
bottom_back = { on = "back", shift = [0, -1, 0] }
ramp        = { on = "front", shift = [0, -1, 0] }

[[parts]]
name = "loft_window"
shape = "box"
size = [0.6, 0.4, 0.06]
color = "white"
attach = "back"
to = "walls.loft"

[[parts]]
name = "ramp"
shape = "wedge"
size = [1.3, 0.12, 0.7]
color = "door"
attach = "back_bottom"
to = "door.ramp"

[parts.sockets]
back_bottom = { on = "back", shift = [0, -1, 0] }

[[parts]]
name = "silo"
shape = "cylinder"
radius = 0.6
height = 3
segments = 16
color = "steel"
attach = "left_bottom"
to = "walls.silo"

[parts.sockets]
left_bottom = { on = "left", shift = [0, -1, 0] }

# Half a ball on top: a capsule exactly as tall as it is wide is a ball,
# and its lower half is inside the silo.
[[parts]]
name = "silo_cap"
shape = "capsule"
radius = 0.6
height = 1.2
segments = 16
color = "roof"
attach = "center"
to = "silo.top"
