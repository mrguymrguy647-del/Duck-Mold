# The Cargo "workspace": one project made of three crates (two Rust
# libraries and a program) that are built together.
#
#   crates/duck-mold-core - the library: recipes, parts, sockets, colour,
#                           the .glb writer and `inspect`. No command line,
#                           no pictures, no game engine.
#   crates/duck-mold-view - pictures of a model (`render`), drawn by Duck
#                           Forge's CPU renderer.
#   crates/duck-mold-cli  - the `duck-mold` program: a thin layer that reads
#                           the command line and prints what the libraries say.
#
# The program uses the libraries; the libraries never use the program. A
# GUI or an MCP server can later sit on the same libraries.

[workspace]
resolver = "3"
members = [
    "crates/duck-mold-core",
    "crates/duck-mold-view",
    "crates/duck-mold-cli",
    "crates/duck-mold-studio",
]

# Settings shared by every crate.
[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/mrguymrguy647-del/Duck-Mold"

# Every outside library, in one place, with why it is here
# (DESIGN.md, section 13, says the same).
[workspace.dependencies]
duck-mold-core = { path = "crates/duck-mold-core" }
duck-mold-view = { path = "crates/duck-mold-view" }
# Reads TOML and says where every field is, for line numbers in errors.
toml = { version = "1", default-features = false, features = ["std", "parse"] }
# Writes JSON: reports, and the JSON block inside a .glb.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads the command line and writes --help from the same comments.
clap = { version = "4", features = ["derive"] }
# Duck Forge, the game engine Duck Mold makes models for: its CPU renderer
# draws `duck-mold render`'s pictures, and its window shows
# `duck-mold preview` (turned on by duck-mold-view's `preview` feature).
# Pinned to one commit on its main branch, so a picture can't change unless
# this line does; that commit has Duck Forge's loader for Duck Mold's .glb
# files (reader version 3). Its graphics-card and sound features are off.
duckforge = { git = "https://github.com/mrguymrguy647-del/Duck-Forge", rev = "1228f77a216a0ce57270057f5abc8e197028fe56", default-features = false }
# Writes the PNG pictures. The same library (and version) Duck Forge uses.
png = "0.18"
# The Studio's window: egui is the interface library, eframe opens the
# window. The same library and version as Duck Quill and Duck Forge's
# Studio, so that Duck Mold's Studio can later be docked inside Duck
# Forge's. Only the duck-mold-studio crate uses it: the command line and
# the libraries build without it.
eframe = "0.37"
# The "Open" and "choose a folder" windows of the operating system.
rfd = "0.17"
# Runs the Studio's screens with no window, for tests: clicks things by
# their label, and can save a picture of the screen.
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

[workspace.lints.rust]
# No `unsafe` anywhere: nothing here needs it.
unsafe_code = "forbid"
# Every public item must say what it is for.
missing_docs = "warn"

# The tests build every example and compare bytes; a little optimisation
# keeps them quick.
[profile.test]
opt-level = 1
